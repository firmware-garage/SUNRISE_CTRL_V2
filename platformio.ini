; Sunrise Light v2 - ESP8266 + WS2815 (144 px)
; USB env for the first flash, OTA env for every update after that.

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
lib_deps =
  makuna/NeoPixelBus @ ^2.8.0
  tzapu/WiFiManager @ ^2.0.17

[env:nodemcuv2_ota]
extends = env:nodemcuv2
upload_protocol = espota
upload_port = sunrise.local   ; or the IP shown at the bottom of the page
upload_flags = --auth=changeme  ; must match OTA_PASSWORD in main.cpp
